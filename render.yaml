services:
  - type: web
    name: shopbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: CANBOSO_API_KEY
        sync: false
      - key: CANBOSO_API_BASE_URL
        value: https://canboso.com
      - key: RETAIL_PRICE_MULTIPLIER
        value: "1.6"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/shopbot.db
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.15
