services:
  - type: web
    name: shopbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/shopbot.db
      - key: LOG_LEVEL
        value: INFO
